<text x="421.7" y="170.9" font-size="12" text-anchor="start" fill="#111827">148,964</text>
<rect x="230.0" y="187.3" width="184.6" height="18" rx="4" fill="#2563eb" opacity="0.8"/>
<text x="222" y="200.3" font-size="12.5" text-anchor="end" fill="#111827">Heater control updates</text>
<text x="420.6" y="200.3" font-size="12" text-anchor="start" fill="#111827">139,213</text>
<rect x="230.0" y="216.7" width="165.0" height="18" rx="4" fill="#2563eb" opacity="0.8"/>
<text x="222" y="229.7" font-size="12.5" text-anchor="end" fill="#111827">Extrusion starts and stops</text>
<text x="401.0" y="229.7" font-size="12" text-anchor="start" fill="#111827">39,606</text>
<rect x="230.0" y="246.1" width="138.8" height="18" rx="4" fill="#2563eb" opacity="0.8"/>
