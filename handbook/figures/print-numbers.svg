<text x="371.4" y="288.5" font-size="12" text-anchor="start" fill="#111827">5,923</text>
<rect x="230.0" y="304.9" width="114.7" height="18" rx="4" fill="#2563eb" opacity="0.8"/>
<text x="222" y="317.9" font-size="12.5" text-anchor="end" fill="#111827">Fan speed changes</text>
<text x="350.7" y="317.9" font-size="12" text-anchor="start" fill="#111827">1,572</text>
<rect x="230.0" y="334.3" width="99.2" height="18" rx="4" fill="#2563eb" opacity="0.8"/>
<text x="222" y="347.3" font-size="12.5" text-anchor="end" fill="#111827">Layers</text>
<text x="335.2" y="347.3" font-size="12" text-anchor="start" fill="#111827">582</text>
<text x="553.0" y="394" font-size="13.5" text-anchor="middle" fill="#111827">How many times it happens (log scale)</text>
<text x="24" y="211.0" font-size="13.5" text-anchor="middle" fill="#111827" transform="rotate(-90 24 211.0)"></text>
</svg>
