<text x="563.5" y="112.1" font-size="12" text-anchor="start" fill="#111827">1,338,132,223</text>
<rect x="230.0" y="128.5" width="197.5" height="18" rx="4" fill="#2563eb" opacity="0.8"/>
<text x="222" y="141.5" font-size="12.5" text-anchor="end" fill="#111827">G-code moves</text>
<text x="433.5" y="141.5" font-size="12" text-anchor="start" fill="#111827">318,033</text>
<rect x="230.0" y="157.9" width="185.7" height="18" rx="4" fill="#2563eb" opacity="0.8"/>
