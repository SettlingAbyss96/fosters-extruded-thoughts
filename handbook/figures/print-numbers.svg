<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="899" height="409" rx="10" fill="white" stroke="#e5e7eb"/>
<text x="20" y="28" font-size="16" font-weight="600" fill="#111827">One toolbox, counted</text>
<text x="20" y="47" font-size="12.5" fill="#6b7280">Four plates of PETG on a Bambu P2S, 202 g, 5 h 48 min. Steps as my Voron's motors would take them</text>
<line x1="230.0" y1="64" x2="230.0" y2="358" stroke="#e5e7eb"/>
<text x="230.0" y="378" font-size="13" text-anchor="middle" fill="#6b7280">1</text>
<line x1="337.7" y1="64" x2="337.7" y2="358" stroke="#e5e7eb"/>
<text x="337.7" y="378" font-size="13" text-anchor="middle" fill="#6b7280">thousand</text>
<line x1="445.3" y1="64" x2="445.3" y2="358" stroke="#e5e7eb"/>
<text x="445.3" y="378" font-size="13" text-anchor="middle" fill="#6b7280">million</text>
<line x1="553.0" y1="64" x2="553.0" y2="358" stroke="#e5e7eb"/>
<text x="553.0" y="378" font-size="13" text-anchor="middle" fill="#6b7280">billion</text>
<line x1="660.7" y1="64" x2="660.7" y2="358" stroke="#e5e7eb"/>
<text x="660.7" y="378" font-size="13" text-anchor="middle" fill="#6b7280">10¹²</text>
<line x1="768.3" y1="64" x2="768.3" y2="358" stroke="#e5e7eb"/>
<text x="768.3" y="378" font-size="13" text-anchor="middle" fill="#6b7280">10¹⁵</text>
<line x1="876.0" y1="64" x2="876.0" y2="358" stroke="#e5e7eb"/>
<text x="876.0" y="378" font-size="13" text-anchor="middle" fill="#6b7280">10¹⁸</text>
<line x1="230" y1="358" x2="876" y2="358" stroke="#111827" stroke-width="1.2"/>
<line x1="230" y1="64" x2="230" y2="358" stroke="#111827" stroke-width="1.2"/>
<rect x="230.0" y="69.7" width="608.5" height="18" rx="4" fill="#7c3aed" opacity="0.8"/>
